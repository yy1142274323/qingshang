name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project QingShang.xcodeproj \
            -scheme QingShang \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            VALIDATE_PRODUCT=NO \
            build 2>&1 | tail -n 60

      - name: Package IPA
        working-directory: ios
        run: |
          APP="build/Build/Products/Release-iphoneos/QingShang.app"
          if [ ! -d "$APP" ]; then
            echo "app not found at $APP"
            find build -name "*.app" -maxdepth 5 || true
            exit 1
          fi
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry QingShang.ipa Payload
          ls -la QingShang.ipa
          unzip -l QingShang.ipa | head -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: QingShang-iOS-ipa
          path: ios/out/QingShang.ipa
          if-no-files-found: error
